{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Log In – MiniInsta{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div style="width:100%;max-width:420px">
    <div class="auth-box">
      <span class="auth-logo">MiniInsta</span>
      <p class="auth-sub">Sign in to discover beautiful photos from the community.</p>
      <form method="post">{% csrf_token %}{{ form|crispy }}
        <button type="submit" class="btn btn-p lg full" style="margin-top:18px">Log In</button>
      </form>
    </div>
    <p class="auth-foot">Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
  </div>
</div>
{% endblock %}
